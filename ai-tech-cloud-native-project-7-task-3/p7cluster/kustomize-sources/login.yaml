---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: login
  namespace: flux-system
spec:
  dependsOn:
    - name: cd-secrets
    - name: mariadb
  interval: 5m0s
  path: ./k8s/login
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true
