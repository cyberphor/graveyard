---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: flux-system
spec:
  chart:
    spec:
      chart: mariadb-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: mariadb
  install:
    crds: Create
  interval: 1h0m0s
  releaseName: mariadb-operator
  targetNamespace: flux-system
  upgrade:
    crds: CreateReplace
