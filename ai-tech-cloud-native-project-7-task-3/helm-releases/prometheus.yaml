---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus
  interval: 1m0s
  values:
    prometheus:
      prometheusSpec:
        additionalScrapeConfigs: |
          - job_name: "prometheus-otel-exporter"
            static_configs:
            - targets: ["simplest-collector.default.svc.cluster.local:9464"]
          - job_name: "mariadb-operator-exporter"
            static_configs:
            - targets: ["mariadb-operator-metrics.default.svc.cluster.local:8080"]
          - job_name: "mariadb-galera-exporter"
            static_configs:
            - targets: ["mariadb-galera-metrics.default.svc.cluster.local:9104"]
          - job_name: "mariadb-webhook-exporter"
            static_configs:
            - targets: ["mariadb-operator-webhook-metrics.default.svc.cluster.local:8080"]
          - job_name: "mariadb-cert-controller-exporter"
            static_configs:
            - targets: ["mariadb-operator-cert-controller-metrics.default.svc.cluster.local:8080"]
          - job_name: "nginx-exporter"
            static_configs:
            - targets: ["nginx-gateway-metrics.nginx-gateway.svc.cluster.local:9113"]
