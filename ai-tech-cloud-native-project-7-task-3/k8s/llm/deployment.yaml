apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmserver
  namespace: default
  labels:
    app: llmserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmserver
  template:
    metadata:
      labels:
        app: llmserver
      annotations:
        instrumentation.opentelemetry.io/inject-python: 'true'
    spec:
      containers:
      - name: llmpod
        image: p7acr.azurecr.io/llm:1713667463-706b4c3cb227fdd08c3fe994c9470b843db3e804 # {"$imagepolicy": "flux-system:llmimagepol"}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources: # Task 2
          requests:
            cpu: "300m"
        startupProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          failureThreshold: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          failureThreshold: 15
          periodSeconds: 30
