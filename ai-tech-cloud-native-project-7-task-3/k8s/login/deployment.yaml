apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  namespace: default
  labels:
    app: login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      initContainers:
      - name: logininit
        image: p7acr.azurecr.io/login:1713667463-706b4c3cb227fdd08c3fe994c9470b843db3e804 # {"$imagepolicy": "flux-system:loginimagepol"}
        command: ["sh", "-c", "python manage.py migrate && python manage.py createsuperuser --no-input --username admin --email testme@test.com || true"]
        env:
        - name: "DJANGO_SUPERUSER_PASSWORD"
          value: "asdasd"
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_PASSWORD
          value: "password"
      containers:
      - name: login
        image: p7acr.azurecr.io/login:1713667463-706b4c3cb227fdd08c3fe994c9470b843db3e804 # {"$imagepolicy": "flux-system:loginimagepol"}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: loginkeys
              key: private_key.pem
        - name: PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: loginkeys
              key: public_key.pem
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_PASSWORD
          value: "password"
        - name: DJANGO_SETTINGS_MODULE
          value: task3.settings
